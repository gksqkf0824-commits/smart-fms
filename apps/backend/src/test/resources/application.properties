# 테스트 공통 DB — Docker/PostgreSQL 없이 ./gradlew test가 돌도록 H2(PostgreSQL 모드)를 쓴다.
# 스키마는 운영과 동일한 db/schema.sql을 그대로 올리고, JPA는 main 설정대로 validate만 한다.
# (파일명이 .properties인 이유: 같은 이름의 application.yml을 두면 main 설정 전체가 가려진다)
spring.datasource.url=jdbc:h2:mem:fms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../../db/schema.sql
