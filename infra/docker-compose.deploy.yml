# EC2 배포용 — 서버에서 빌드하지 않고 미리 만든 이미지를 사용한다 (메모리 908MB 제약)
services:
  database:
    image: postgres
    container_name: fms-postgres
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: fms_db
    # 포트를 외부로 열지 않는다 — 백엔드만 내부 네트워크로 접근
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fms_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: fms-backend:deploy
    container_name: fms-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      # 메모리 908MB 서버 — JVM 힙 상한을 명시해 OOM 방지
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m"
      # S3는 EC2 IAM 역할로 인증 (자격증명 파일 없음)
      APP_S3_ENABLED: "true"
      AWS_S3_BUCKET: smart-fms-inspections-evida
      AWS_REGION: ap-northeast-2
      # 디스코드는 테스트 중 채널 도배 방지를 위해 끔
      APP_DISCORD_ENABLED: "false"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
